# docker compose for the security scanning tests

services:
  scanner:
    build:
      context: ../..
      dockerfile: testing/security_scanning_tests/Dockerfile

    # run as your dgx user — set UID/GID in .env (see .env.example), NOT sudo
    # without this, container runs as root and output/ files become undeletable without a trick
    user: "${UID}:${GID}"

    volumes:
      # bind-mount: files here persist on the dgx host even after container exits
      # ./models on dgx  <->  /models inside container
      - ./models:/models
      # scan json reports land here on the dgx host
      - ./output:/output

    environment:
      # optional — set on dgx host before running for faster hf downloads:
      #   export HF_TOKEN=hf_...
      - HF_TOKEN=${HF_TOKEN:-}
      # which hugging face repo to download/scan (default: distilbert-base-uncased)
      - MODEL_ID=${MODEL_ID:-distilbert-base-uncased}

    # needed so "docker compose run ... bash" gives you an interactive shell
    stdin_open: true
    tty: true
