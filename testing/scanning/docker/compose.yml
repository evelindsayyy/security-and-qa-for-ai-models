# Run from testing/scanning/: docker compose -f docker/compose.yml build

services:
  scanner:
    build:
      context: ../../..
      dockerfile: testing/scanning/docker/Dockerfile

    user: "${UID}:${GID}"

    volumes:
      - ../models:/models
      - ../output:/output

    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - MODEL_ID=${MODEL_ID:-distilbert-base-uncased}
      - HF_HOME=/models/.cache/huggingface

    stdin_open: true
    tty: true
