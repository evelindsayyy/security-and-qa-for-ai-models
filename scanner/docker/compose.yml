# Secrets (HF_TOKEN) come from the repo-root .env (see .env.example).
# From repo root:
#   docker compose --env-file .env -f scanner/docker/compose.yml build
#   docker compose --env-file .env -f scanner/docker/compose.yml run --rm scanner \
#     python -m scanner scan gpt2
#
# Model weights use a named Docker volume (typically on / under Docker's data
# root) so multi-GB HF downloads are not capped by a small /home repo partition.
# Override with SCANNER_MODELS_HOST_PATH=/path/on/host to bind-mount instead.

services:
  scanner:
    build:
      context: ../..
      dockerfile: scanner/docker/Dockerfile

    volumes:
      - ..:/app/scanner
      - ../output:/app/scanner/output
      # Named volume by default; bind host path when SCANNER_MODELS_HOST_PATH is set.
      - ${SCANNER_MODELS_HOST_PATH:-scanner_models}:/app/scanner/models

    environment:
      - UID=${UID:-1000}
      - GID=${GID:-1000}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - HF_HUB_DOWNLOAD_TIMEOUT=${HF_HUB_DOWNLOAD_TIMEOUT:-300}
      - HF_HUB_ETAG_TIMEOUT=${HF_HUB_ETAG_TIMEOUT:-60}
      # Parallel HF file downloads (1 = safest on ~5 GiB RAM VMs). Empty → auto from MemAvailable.
      - SCAN_HF_MAX_WORKERS=${SCAN_HF_MAX_WORKERS:-}
      - SCAN_MAX_MODEL_GB=${SCAN_MAX_MODEL_GB:-80}
      - MODEL_ID=${MODEL_ID:-distilbert-base-uncased}
      - MODELS_ROOT=/app/scanner/models
      - POSTGRES_DSN=${POSTGRES_DSN:-}
      - DATABASE_URL=${DATABASE_URL:-}
      # Weights under models/<slug>/ are removed after scan unless SCAN_KEEP_WEIGHTS=1
      - SCAN_KEEP_WEIGHTS=${SCAN_KEEP_WEIGHTS:-}
      # OSV API queries require outbound HTTPS from the container.

    stdin_open: true
    tty: true

volumes:
  scanner_models:
    name: ${SCANNER_MODELS_VOLUME_NAME:-qa-ai-models_scanner_models}
