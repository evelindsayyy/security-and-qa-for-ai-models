# GitLab CI — Duke Code+ shared runners (docker+machine).
#
# Lint/test: uv sync core+dev deps (slim pyproject — no torch/CUDA).
# Build: Docker-in-Docker (shared runners do not mount host /var/run/docker.sock).

stages:
  - lint
  - test
  - build
  #- deploy

default:
  interruptible: true
  image: gitlab-registry.oit.duke.edu/codeplus/security-and-qa-for-ai-models/dev:local

.default_ci:
  before_script:
    - uv sync --frozen --group dev

lint:
  extends: .default_ci
  stage: lint
  script:
    - uv run ruff check .

unit-tests:
  extends: .default_ci
  stage: test
  script:
    - uv run python -m unittest discover -s unit_tests -v

build-images:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - until docker info; do sleep 1; done
  script:
    - docker compose --project-name qa-ai-models -f docker/compose.yml build
    - docker compose --project-name qa-ai-models -f scanner/docker/compose.yml build

