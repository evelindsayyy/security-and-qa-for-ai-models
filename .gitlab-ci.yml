# GitLab CI — Duke Code+ shared runners (docker+machine).
#
# Lint/test: uv sync core+dev deps (slim pyproject — no torch/CUDA).
# Build: docker:27-cli talks to host daemon via DOCKER_HOST. Deploy is manual and needs .env on the runner.

stages:
  - lint
  - test
  - build
  #- deploy

default:
  interruptible: true
  image: gitlab-registry.oit.duke.edu/codeplus/security-and-qa-for-ai-models/dev:local

variables:
  DOCKER_HOST: "unix:///var/run/docker.sock"

.default_ci:
  before_script:
    - uv sync --frozen --group dev

lint:
  extends: .default_ci
  stage: lint
  script:
    - uv run ruff check .

unit-tests:
  extends: .default_ci
  stage: test
  script:
    - uv run python -m unittest discover -s unit_tests -v

build-images:
  stage: build
  image: docker:27-cli
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - docker compose version
    - docker compose --project-name qa-ai-models -f docker/compose.yml build
    - docker compose --project-name qa-ai-models -f scanner/docker/compose.yml build

