# GitLab CI — Duke Code+ shared runners (docker+machine).
#
# Lint + unit tests run by default. Docker daemon builds are not available on
# shared runners; the main-branch web image build uses the Buildah runner instead.

stages:
  - lint
  - test
  - build
  - deploy

default:
  interruptible: true
  image: gitlab-registry.oit.duke.edu/codeplus/security-and-qa-for-ai-models/dev:local

.default_ci:
  before_script:
    - uv sync --frozen --group dev

lint:
  extends: .default_ci
  stage: lint
  script:
    - uv run ruff check .

unit-tests:
  extends: .default_ci
  stage: test
  variables:
    AUTO_INGEST: "0"
    POSTGRES_DSN: ""
    EFFICACY_DB_DSN: ""
    DATABASE_URL: ""
  script:
    - uv run python -m unittest discover -s unit_tests -q

# Build is like docker but has better security permissions and better licensing
build-web-image:
  stage: build
  needs:
    - lint
    - unit-tests
  tags:
    # This is a runner designed to be able to build containers
    - oit-shared-buildah
  rules:
    # We do not want the container to build for any branch except main
    - if: $CI_COMMIT_BRANCH == "main"
    - when: never
  # This is our base image that already has buildah installed
  image: quay.io/buildah/stable:v1.39.3
  variables:
    # These variables are set before the script stuff runs
    FULL_IMAGE_NAME: ${CI_REGISTRY_IMAGE}/web:${CI_COMMIT_SHORT_SHA}
  script:
    # these steps all run in order
    - set -euo pipefail
    - export STORAGE_DRIVER=vfs
    - export REGISTRY_AUTH_FILE=${HOME}/auth.json
    - printf '%s' "${CI_REGISTRY_PASSWORD}" | buildah login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
    # build the container
    - buildah bud --isolation=chroot -f docker/Dockerfile -t "${FULL_IMAGE_NAME}" .
    # push it to the project registry
    - buildah push "${FULL_IMAGE_NAME}"

# Deploy to the application VM after lint, tests, and image build on main.
#
# Default: manual (team lead safety — click Play in GitLab). Set CI/CD variable
# DEPLOY_AUTO=true to deploy automatically on every main pipeline.
#
# GitLab CI/CD variables (Settings → CI/CD → Variables):
#   DEPLOY_SSH_PRIVATE_KEY (file, masked) — CI → VM SSH key
#   DEPLOY_SSH_KNOWN_HOSTS (file) — ssh-keyscan output for DEPLOY_HOST
#   DEPLOY_USER — e.g. vcm
#   DEPLOY_HOST — e.g. model-advisor.colab.duke.edu
#   DEPLOY_PATH — e.g. /home/vcm/security-and-qa-for-ai-models
# Optional: BUILD_PILLARS=1 to rebuild pillar images on the VM after git pull
# Optional: DEPLOY_AUTO=true — automatic deploy after build-web-image (else manual)
deploy:
  stage: deploy
  image: alpine:3.21
  needs:
    - build-web-image
  environment:
    name: production
    url: https://model-advisor.colab.duke.edu
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_AUTO == "true"
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - when: never
  variables:
    WEB_IMAGE: ${CI_REGISTRY_IMAGE}/web:${CI_COMMIT_SHORT_SHA}
  before_script:
    - apk add --no-cache openssh-client bash
    - test -n "${DEPLOY_SSH_PRIVATE_KEY:-}" || (echo "DEPLOY_SSH_PRIVATE_KEY not set" >&2 && exit 1)
    - test -n "${DEPLOY_SSH_KNOWN_HOSTS:-}" || (echo "DEPLOY_SSH_KNOWN_HOSTS not set" >&2 && exit 1)
    - test -n "${DEPLOY_USER:-}" || (echo "DEPLOY_USER not set" >&2 && exit 1)
    - test -n "${DEPLOY_HOST:-}" || (echo "DEPLOY_HOST not set" >&2 && exit 1)
    - test -n "${DEPLOY_PATH:-}" || (echo "DEPLOY_PATH not set" >&2 && exit 1)
    - chmod 600 "${DEPLOY_SSH_PRIVATE_KEY}"
  script:
    - set -euo pipefail
    - |
      ssh -i "${DEPLOY_SSH_PRIVATE_KEY}" \
        -o IdentitiesOnly=yes \
        -o StrictHostKeyChecking=yes \
        -o UserKnownHostsFile="${DEPLOY_SSH_KNOWN_HOSTS}" \
        "${DEPLOY_USER}@${DEPLOY_HOST}" \
        "export DEPLOY_PATH='${DEPLOY_PATH}' WEB_IMAGE='${WEB_IMAGE}' CI_REGISTRY='${CI_REGISTRY}' CI_JOB_TOKEN='${CI_JOB_TOKEN}' BUILD_PILLARS='${BUILD_PILLARS:-0}' GIT_REF='${CI_DEFAULT_BRANCH}' && bash -s" \
        < docker/deploy-remote.sh
