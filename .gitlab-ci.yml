# GitLab CI — Duke Code+ shared VM (VCM).
#
# Merged from team-lead skeleton (tag codeplus, interruptible, compose build/deploy)
# and project jobs (uv, ruff, unit tests, real compose paths).
#
# VM prerequisites: git, docker + compose plugin, curl; uv auto-installed if missing.
# Lint/test need no secrets. Deploy is manual and requires .env on the runner host.

stages:
  - lint
  #- test
  #- build
  #- deploy

default:
  interruptible: true

variables:
  UV_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/uv"
  PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/pip"
  DOCKER_HOST: "unix:///var/run/docker.sock"

.default_uv:
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/uv
      - .venv
  before_script:
    - export PATH="${HOME}/.local/bin:${PATH}"
    - command -v uv >/dev/null || curl -LsSf https://astral.sh/uv/install.sh | sh
    - uv sync --frozen --group dev

lint:
  extends: .default_uv
  stage: lint
  image: gitlab-registry.oit.duke.edu/codeplus/security-and-qa-for-ai-models/dev:local
  script:
    - uv run ruff check .

