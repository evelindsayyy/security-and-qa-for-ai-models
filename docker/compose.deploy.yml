# Production override: pull the CI-built web image instead of building locally.
#
#   export WEB_IMAGE=${CI_REGISTRY_IMAGE}/web:${CI_COMMIT_SHORT_SHA}
#   docker compose -f docker/compose.yml -f docker/compose.deploy.yml pull web
#   docker compose -f docker/compose.yml -f docker/compose.deploy.yml up -d --no-build web
#
# Requires WEB_IMAGE (GitLab container registry tag from build-web-image job).

services:
  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to the registry tag (e.g. registry…/web:abc1234)}
