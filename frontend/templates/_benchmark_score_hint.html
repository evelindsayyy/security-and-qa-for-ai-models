{% if hint %}
<p class="form-hint{% if reference %} reference-score-hint{% endif %}">
  {% if show_label %}<strong>Score guide:</strong> {% endif %}{{ hint }}
</p>
{% endif %}
{% if sources %}
<ul class="score-hint-sources{% if reference %} reference-score-hint-sources{% endif %}">
  {% for src in sources %}
  <li>
    {% if src.url %}
    <a href="{{ src.url }}" rel="noopener noreferrer">{{ src.label }}</a>
    {% else %}
    {{ src.label }}
    {% endif %}
  </li>
  {% endfor %}
</ul>
{% endif %}
