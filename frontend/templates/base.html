<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}AI Model Security & QA{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <nav>
      <a href="{{ url_for('index') }}">Home</a>
      <a href="{{ url_for('models_catalog') }}">Model catalog</a>
      <a href="{{ url_for('scans') }}">Scans</a>
      <a href="{{ url_for('eval_run') }}">Eval</a>
      <a href="{{ url_for('safety') }}">Safety</a>
      <a href="{{ url_for('benchmarks') }}">Benchmarks</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
  (function () {
    function go(row) {
      var href = row.getAttribute("data-href");
      if (href) window.location.href = href;
    }
    document.addEventListener("click", function (e) {
      var row = e.target.closest("tr.row-link");
      if (!row || e.target.closest("a, button, input, select, textarea, label")) return;
      go(row);
    });
    document.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" && e.key !== " ") return;
      var row = e.target.closest("tr.row-link");
      if (!row) return;
      e.preventDefault();
      go(row);
    });
  })();
  </script>
</body>
</html>
