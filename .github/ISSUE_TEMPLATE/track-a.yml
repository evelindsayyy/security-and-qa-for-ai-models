name: Track A issue
description: Artifact scanning or inference safety work
title: "[Track A] "
labels: [track-a]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      placeholder: As a role, I want a goal, so that benefit.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable completion conditions.
    validations:
      required: true
  - type: checkboxes
    id: data
    attributes:
      label: Tool output and data model
      options:
        - label: Raw tool output was reviewed and its location is recorded.
        - label: Normalized JSON matches the documented scan or safety shape.
        - label: Provisional JSONB fields are identified.
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
