[project]
name = "security-and-qa-for-ai-models"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "absl-py>=2.4.0",
    "bert-score>=0.3.13",
    "datasets>=5.0.0",
    "flask>=3.1.3",
    "fickling>=0.1.0",
    "huggingface-hub>=0.34.0",
    "immutabledict>=4.3.1",
    "langdetect>=1.0.9",
    "litellm>=1.87.1",
    "modelaudit>=0.2.45",
    "modelscan>=0.3.0",
    "nltk>=3.9.4",
    "openai>=2.38.0",
    "pip-audit>=2.9.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "ruff>=0.15.15",
]

[dependency-groups]
# Postgres driver for dbutils + pillar ingest (--apply) and optional UI read paths.
# Optional on purpose: plain `uv sync` skips it; install with
#   uv sync --group db
db = ["psycopg[binary]>=3.2"]
