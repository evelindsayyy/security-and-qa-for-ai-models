# Public benchmark pilots — browser + CLI. See benchmarks/README.md
# Secrets come from the repo-root .env (see .env.example). Run from the repo root:
#
#   docker compose --env-file .env \
#     -f benchmarks/docker/compose.yml run --rm benchmarks \
#     python run_benchmark.py --benchmark truthfulqa --model "GPT 4.1 Mini"

services:
  benchmarks:
    build:
      context: ../..
      dockerfile: benchmarks/docker/Dockerfile

    user: "${UID:-1000}:${GID:-1000}"

    volumes:
      - ../results:/app/benchmarks/results

    environment:
      - DUKE_GATEWAY_URL=${DUKE_GATEWAY_URL:-https://litellm.oit.duke.edu/v1}
      - DUKE_GATEWAY_KEY=${DUKE_GATEWAY_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://litellm.oit.duke.edu/v1}
      - LITELLM_BASE_URL=${OPENAI_BASE_URL:-https://litellm.oit.duke.edu/v1}
      - LITELLM_API_KEY=${OPENAI_API_KEY:-}

    working_dir: /app/benchmarks

    stdin_open: true
    tty: true
