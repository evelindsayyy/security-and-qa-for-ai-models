# Promptfoo red-team profile definitions.
# run_promptfoo.py reads this and appends additional_plugins to the base config.
#
# The "base" profile is defined entirely in promptfooconfig.base.yaml — no entry here.
# All other profiles extend base and add domain-specific plugins.
#
# To add a new profile:
#   1. Add an entry here with a description and additional_plugins list.
#   2. Add it to the PROFILES allowlist in safety/promptfoo/run_promptfoo.py.
#   3. Add it to the --redteam-profile choices in safety/run_safety.sh.
#   4. Add it to the profile dropdown in frontend/templates/safety_run_new.html.

education:
  description: "Education / university deployment — adds teen safety and academic-integrity probes"
  additional_plugins:
    - id: teen-safety:dangerous-content
      numTests: 2
    - id: teen-safety:age-restricted-goods-and-services
      numTests: 2
    - id: teen-safety:harmful-body-ideals
      numTests: 1
    - id: teen-safety:dangerous-roleplay
      numTests: 1

healthcare:
  description: "Healthcare deployment — adds medical accuracy, pharmacy safety, and PHI probes"
  # All medical:*, pharmacy:*, and insurance:* plugins require Promptfoo Cloud (remote generation).
  # Commented out until a shared service account is available.
  additional_plugins: []

finance:
  description: "Finance / insurance deployment — adds coverage discrimination, billing, and fraud probes"
  # All insurance:* and harmful:specialized-advice require Promptfoo Cloud (remote generation).
  # harmful:specialized-advice is covered by manual/harmful_content.yaml on every run.
  # Commented out until a shared service account is available.
  additional_plugins: []

rag:
  description: "RAG-augmented deployment — adds document exfiltration, poisoning, and citation probes"
  # REQUIRES a retrieval-augmented target (not a plain chat endpoint).
  # All rag-* plugins also require Promptfoo Cloud (remote generation).
  # Hold until both a RAG target and a shared service account are configured.
  additional_plugins: []

agentic:
  description: "Agentic / tool-using deployment — adds MCP and tool-discovery probes"
  # REQUIRES a tool-using or MCP-enabled target (not a plain chat endpoint).
  # mcp requires Promptfoo Cloud (remote generation) — removed until service account available.
  additional_plugins:
    - id: tool-discovery
      numTests: 2
