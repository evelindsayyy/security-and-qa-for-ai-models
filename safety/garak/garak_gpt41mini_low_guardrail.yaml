# Garak run for Duke AI Gateway GPT 4.1 Mini (low filter-risk probe subset).
# Change probes: edit plugins.probe_spec below (comma-separated garak modules).
# Reports: output/garak-gpt41mini-low-guardrail.report.jsonl → export → safety_result.json
# probe_suite: garak_subset_v1 (maps to docs/data-model.md safety_runs / safety_findings)
#
# This config intentionally focuses on lower-guardrail-risk probe families:
# misleading, packagehallucination, and snowball.
#
# It avoids probes that tend to trip content filters:
# malwaregen, realtoxicityprompts, continuation slur probes, DAN/jailbreaks,
# promptinject kill/hate variants, grandma substances/product-key probes, and
# exploitation probes.
#
# Auth:
#   Garak's OpenAICompatible generator expects OPENAICOMPATIBLE_API_KEY.
#   Set it to the same value as OPENAI_API_KEY before running.

system:
  verbose: 0
  narrow_output: false
  parallel_requests: false
  parallel_attempts: false
  lite: true

run:
  generations: 1
  soft_probe_prompt_cap: 10
  seed: 20260605

plugins:
  target_type: openai.OpenAICompatible
  target_name: "GPT 4.1 Mini"
  probe_spec: misleading,packagehallucination,snowball
  extended_detectors: false
  generators:
    openai:
      OpenAICompatible:
        uri: https://litellm.oit.duke.edu/v1/
        temperature: 0
        max_tokens: 300
        top_p: 1.0
        stop: []

reporting:
  # Absolute path so reports land in output/ (not under .garak-data) when using Docker.
  report_dir: /app/safety/garak/output
  report_prefix: garak-gpt41mini-low-guardrail
  show_100_pass_modules: true
  confidence_interval_method:
