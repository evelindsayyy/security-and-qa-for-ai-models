# Run from repo root — see ../README.md. Secrets come from the repo-root .env.
#
#   docker compose --env-file .env \
#     -f safety/garak/docker/compose.yml build
#
# Use run_garak.py — it auto-selects the generator profile (standard vs openai5):
#   docker compose --env-file .env \
#     -f safety/garak/docker/compose.yml run --rm garak \
#     python run_garak.py "GPT 4.1 Mini"
#
#   docker compose --env-file .env \
#     -f safety/garak/docker/compose.yml run --rm garak \
#     python run_garak.py "gpt-5.5"

name: garak

services:
  garak:
    build:
      context: ../../..
      dockerfile: safety/garak/docker/Dockerfile
      args:
        GARAK_VERSION: ${GARAK_VERSION:-}

    volumes:
      - ../:/app/safety/garak

    environment:
      # garak's OpenAICompatible generator reads OPENAICOMPATIBLE_API_KEY; map it
      # from the single gateway token in the repo-root .env.
      - OPENAICOMPATIBLE_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - HOME=/app/safety/garak/output/.garak-home
      - USER=garak
      - LOGNAME=garak
      - TORCHINDUCTOR_CACHE_DIR=/app/safety/garak/output/.garak-cache/torchinductor
      - XDG_DATA_HOME=/app/safety/garak/output/.garak-data
      - XDG_CACHE_HOME=/app/safety/garak/output/.garak-cache
      - XDG_CONFIG_HOME=/app/safety/garak/output/.garak-config

    stdin_open: true
    tty: true
