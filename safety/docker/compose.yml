# Orchestrates safety/run_safety.sh (Promptfoo + Garak docker sub-stacks + merge).
# Browser launches call ensure_stack("safety") then compose run this service.
# Secrets come from the repo-root .env (see .env.example). Run from the repo root:
#
#   docker compose --env-file .env \
#     -f safety/docker/compose.yml run --rm safety \
#     ./safety/run_safety.sh "GPT 4.1 Mini"

services:
  safety:
    build:
      context: ../..
      dockerfile: safety/docker/Dockerfile

    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - "${DOCKER_GID:-998}"

    volumes:
      - ../..:/app
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      - GATEWAY_MODEL=${GATEWAY_MODEL:-GPT 4.1 Mini}
      - REDTEAM_GRADER_MODEL=${REDTEAM_GRADER_MODEL:-GPT 4.1 Mini}
      - OPENAICOMPATIBLE_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PYTHONPATH=/app
      - HOME=/app/safety/garak/output/.garak-home
      - XDG_DATA_HOME=/app/safety/garak/output/.garak-data
      - XDG_CACHE_HOME=/app/safety/garak/output/.garak-cache
      - XDG_CONFIG_HOME=/app/safety/garak/output/.garak-config

    working_dir: /app

    stdin_open: true
    tty: true
