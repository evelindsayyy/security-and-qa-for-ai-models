# Reusable Promptfoo red-team template for the safety pipeline.
# This keeps the red-team plugin setup separate from the target configuration.

redteam:
  purpose: "Run red-team probes against {{label}} while keeping the policy suite reusable."
  provider:
    id: "{{provider_id}}"
    config:
      apiBaseUrl: "{{api_base_url}}"
      apiKeyEnvar: "{{api_key_env}}"
      temperature: {{temperature}}
      max_tokens: {{max_tokens}}
  numTests: 3
  injectVar: prompt
  plugins:
    - id: policy
      numTests: 3
    - id: hallucination
      numTests: 3
    - id: overreliance
      numTests: 3
